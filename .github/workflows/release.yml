name: release

# Auto-bump + tag + publish release on every push to main.
#
# Maintainer flow: just merge PRs. Each push to main that doesn't
# already have a matching v<version> tag triggers a release. The
# workflow auto-bumps the PATCH digit (0.4.6 -> 0.4.7), commits
# the bump + a CHANGELOG entry to main, tags, and publishes.
#
# If the maintainer already bumped package.json in their PR, the
# workflow uses that version (no double-bump).
#
# Manual override: `workflow_dispatch` with auto_bump: false skips
# the bump for ad-hoc tags.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Override the release version (defaults to package.json)"
        required: false
        type: string
      auto_bump:
        description: "Auto-bump patch version when tag exists. Default: true."
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: publish release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${PKG_VERSION}"
          fi
          # If the tag already exists, auto-bump the patch digit so a
          # push to main always produces a new release (unless the
          # maintainer disabled auto_bump via workflow_dispatch).
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            if [ "${{ inputs.auto_bump }}" = "false" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Tag v${VERSION} already exists; auto_bump disabled."
              exit 0
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
            BASE_PATCH="${PATCH%%-*}"
            PATCH=$((10#${BASE_PATCH} + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Auto-bumping ${VERSION} -> ${NEW_VERSION} (tag v${VERSION} already exists)"
            # Update package.json with the bumped version. Use node
            # for safe JSON edit; strip any pre-release suffix first.
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              p.version = process.argv[1];
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            " "${NEW_VERSION}"
            # Insert a CHANGELOG entry right after the header (between
            # the intro paragraph and the first ## [X.Y.Z] entry).
            CHANGELOG="CHANGELOG.md"
            if [ -f "${CHANGELOG}" ]; then
              TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              # Find the first "## [" line and insert the new entry
              # before it. Use head/tail (NOT sed -i): sed's `i\\`
              # command treats the first character of the inserted
              # text as a flag, so a markdown bullet '-' breaks with
              # 'unknown command: `-`' errors. head+tail has no such
              # ambiguity.
              INSERT_LINE="$(grep -n '^## \[' "${CHANGELOG}" | head -1 | cut -d: -f1)"
              if [ -n "${INSERT_LINE}" ]; then
                NEW_ENTRY="## [${NEW_VERSION}] - ${TS}"$'\n\n'"### Changed"$'\n\n'"- Auto-bumped patch version after PR merge."$'\n\n'
                {
                  head -n $((INSERT_LINE - 1)) "${CHANGELOG}"
                  printf '%s' "${NEW_ENTRY}"
                  tail -n +"${INSERT_LINE}" "${CHANGELOG}"
                } > "${CHANGELOG}.new"
                mv "${CHANGELOG}.new" "${CHANGELOG}"
              fi
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json "${CHANGELOG}" 2>/dev/null || git add package.json
            git commit -m "chore(release): auto-bump to ${NEW_VERSION}"
            git push origin HEAD:main
            VERSION="${NEW_VERSION}"
            echo "::notice::Auto-bumped to ${NEW_VERSION}; CHANGELOG and package.json updated on main."
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=v${VERSION}"

      - name: Skip if tag already exists
        id: check
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Rocinante ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
