name: install smoke

# Smoke-test the standalone install script (scripts/install.sh) on the
# two Unix target OSes (ubuntu + macos). The PowerShell installer
# (scripts/install.ps1) is no longer covered here — the upstream
# `omp.sh` PowerShell installer is unreliable on the GitHub Actions
# Windows runner, so the Windows job was dropped (2026-08-13) until
# upstream stabilises.
#
# Why this exists:
#   The install script is the first thing a new user runs. A regression
#   here blocks every first-run. Running it in CI is cheap (one job
#   per OS) and catches breakage before release.

on:
  push:
    branches: [main, feat/**]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: install.sh on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Pin a release tag so the smoke test is deterministic. Override
      # with PI_REF=main to test the rolling upstream.
      PI_REF: ${{ vars.PI_REF || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run install.sh
        shell: bash
        env:
          PI_REF: ${{ env.PI_REF }}
        run: |
          set -eux
          bash scripts/install.sh
      - name: Smoke-test post-install
        shell: bash
        run: |
          set -eux
          # The script prepends $HOME/.local/bin to PATH; mirror that for
          # the smoke checks below.
          export PATH="$HOME/.local/bin:$PATH"
          test -x "$(command -v omp)" || (echo "omp not on PATH after install" && exit 1)
          test -x "$(command -v rocinante)" || (echo "rocinante not on PATH after install" && exit 1)
          omp --version
          rocinante --version || true  # --version may not be wired yet
          # Verify the package.json bin resolves to the renamed file.
          node -e 'const p=require("./package.json"); if(p.bin.rocinante !== "bin/rocinante.js"){throw new Error("bin field points at "+p.bin.rocinante)}'
